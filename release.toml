[project]
id = "promptr"
name = "Promptr"
version_file = "VERSION"
description = "Native GTK4 chat frontend with independent provider plugins"
homepage = "https://github.com/toxdes/promptr"
repository = "https://github.com/toxdes/promptr"
license = "MIT"
maintainer = "toxdes <hi@toxdes.com>"

[build]
dockerfile = "Dockerfile"
context = "."
output_dir = "dist"
platforms = ["linux/amd64", "linux/arm64"]

[build.args]
BUILD = "release"
INCLUDE_APPIMAGE = "1"

[artifacts]
deb = ["*.deb"]
rpm = ["*.rpm"]
archive = ["*.tar.gz"]
appimage = ["*.AppImage"]

[[release.artifacts]]
name = "promptr_{version}_amd64.deb"
platform = "linux"
architecture = "amd64"

[[release.artifacts]]
name = "promptr_{version}_arm64.deb"
platform = "linux"
architecture = "arm64"

[[release.artifacts]]
name = "promptr-{version}-1.x86_64.rpm"
platform = "linux"
architecture = "amd64"

[[release.artifacts]]
name = "promptr-{version}-1.aarch64.rpm"
platform = "linux"
architecture = "arm64"

[[release.artifacts]]
name = "promptr_{version}_amd64.tar.gz"
platform = "linux"
architecture = "amd64"

[[release.artifacts]]
name = "promptr_{version}_arm64.tar.gz"
platform = "linux"
architecture = "arm64"

[[release.artifacts]]
name = "promptr-{version}-amd64.AppImage"
platform = "linux"
architecture = "amd64"

[[release.artifacts]]
name = "promptr-{version}-arm64.AppImage"
platform = "linux"
architecture = "arm64"

[package]
binary = "promptr"

[package.deb]
assets = [
  { source = "providers/promptr-opencode/promptr-opencode", dest = "/usr/lib/promptr/plugins/opencode/promptr-opencode", mode = 493 },
  { source = "providers/promptr-opencode/plugin.json", dest = "/usr/lib/promptr/plugins/opencode/plugin.json", mode = 420 },
  { source = "providers/promptr-openrouter/promptr-openrouter", dest = "/usr/lib/promptr/plugins/openrouter/promptr-openrouter", mode = 493 },
  { source = "providers/promptr-openrouter/plugin.json", dest = "/usr/lib/promptr/plugins/openrouter/plugin.json", mode = 420 },
  { source = "data/promptr.svg", dest = "/usr/share/icons/hicolor/scalable/apps/promptr.svg", mode = 420 },
  { source = "com.toxdes.promptr.desktop", dest = "/usr/share/applications/com.toxdes.promptr.desktop", mode = 420 },
]

[package.rpm]
assets = [
  { source = "providers/promptr-opencode/promptr-opencode", dest = "/usr/lib/promptr/plugins/opencode/promptr-opencode", mode = 493 },
  { source = "providers/promptr-opencode/plugin.json", dest = "/usr/lib/promptr/plugins/opencode/plugin.json", mode = 420 },
  { source = "providers/promptr-openrouter/promptr-openrouter", dest = "/usr/lib/promptr/plugins/openrouter/promptr-openrouter", mode = 493 },
  { source = "providers/promptr-openrouter/plugin.json", dest = "/usr/lib/promptr/plugins/openrouter/plugin.json", mode = 420 },
  { source = "data/promptr.svg", dest = "/usr/share/icons/hicolor/scalable/apps/promptr.svg", mode = 420 },
  { source = "com.toxdes.promptr.desktop", dest = "/usr/share/applications/com.toxdes.promptr.desktop", mode = 420 },
]

[package.archive]
assets = [
  { source = "providers/promptr-opencode/promptr-opencode", dest = "/usr/lib/promptr/plugins/opencode/promptr-opencode", mode = 493 },
  { source = "providers/promptr-opencode/plugin.json", dest = "/usr/lib/promptr/plugins/opencode/plugin.json", mode = 420 },
  { source = "providers/promptr-openrouter/promptr-openrouter", dest = "/usr/lib/promptr/plugins/openrouter/promptr-openrouter", mode = 493 },
  { source = "providers/promptr-openrouter/plugin.json", dest = "/usr/lib/promptr/plugins/openrouter/plugin.json", mode = 420 },
  { source = "data/promptr.svg", dest = "/usr/share/icons/hicolor/scalable/apps/promptr.svg", mode = 420 },
  { source = "com.toxdes.promptr.desktop", dest = "/usr/share/applications/com.toxdes.promptr.desktop", mode = 420 },
]

[package.appimage]
icon = "data/promptr.svg"
desktop = "com.toxdes.promptr.desktop"

[deb]
helper_image = "docker.io/toxdes/yesb-apt-helper@sha256:ec2452ba31dcec97924f061352ed84626ee890d3b88f33bddf6eb22fe8eb635f"
package_name = "promptr"
section = "utils"
priority = "optional"
architectures = ["amd64", "arm64"]
depends = [
  "libgtk-4-1",
  "libgtksourceview-5-0",
  "libgtk4-layer-shell0",
  "libcurl4t64",
  "libjson-glib-1.0-0",
  "libsecret-1-0",
]

[rpm]
helper_image = "docker.io/toxdes/yesb-rpm-helper@sha256:ee8caaff1fd1434b1414e09b5fce00572d3199b622f6ba39f73a3934117e221c"
package_name = "promptr"
release = "1"
architectures = ["x86_64", "aarch64"]
requires = [
  "gtk4",
  "gtksourceview5",
  "gtk4-layer-shell",
  "libcurl",
  "json-glib",
  "libsecret",
]

[aur]
binary_package = "promptr-bin"
git_package = "promptr-git"
srcinfo_helper_image = "docker.io/toxdes/yesb-aur-helper@sha256:e0b511b58baf4d1e281b154a50fd15125f886472dc7166a4aa578cb7a40435ea"
architectures = ["x86_64", "aarch64"]
depends = ["gtk4", "gtksourceview5", "gtk4-layer-shell", "curl", "json-glib", "libsecret"]
source_pkgbuild = "PKGBUILD.source"
git_pkgbuild = "PKGBUILD"

[hosting]
public_base_url = "https://packages.toxdes.com"
apt_prefix = "apt"
rpm_prefix = "rpm"
release_prefix = "releases"

[hosting.apt]
suite = "stable"
component = "main"
origin = "toxdes"
label = "promptr"

[hosting.signing]
gpg_key_env = "GPG_KEY_ID"
gpg_passphrase_env = "GPG_PASSPHRASE"

[hosting.aur]
host = "aur.archlinux.org"
ssh_user = "aur"
maintainer = "toxdes <hi@toxdes.com>"
